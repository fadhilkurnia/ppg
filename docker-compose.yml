services:
  app:
    build: .
    image: ppg-dashboard:latest
    container_name: ppg-dashboard
    ports:
      - "${PORT:-8080}:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL:-24h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_PATH: /app/data/app.db
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      BULK_MAX_BYTES: ${BULK_MAX_BYTES:-20971520}
      DYNAMIC_API_PATH: ${DYNAMIC_API_PATH:-false}
      WA_BOT_PHONE: ${WA_BOT_PHONE:-6287781485093}
      APP_BASE_URL: ${APP_BASE_URL:-https://ppg.tail31c665.ts.net}
    volumes:
      - ppg-data:/app/data
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ppg-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    restart: unless-stopped
    profiles: ["tunnel"]

volumes:
  ppg-data:
